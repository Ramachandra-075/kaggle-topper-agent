name: Kaggle EV Purchase 24x7 Autonomous Cycle

on:
  workflow_dispatch:
  schedule:
    # Cloud runner wakes every 6 hours; the user's PC can remain off.
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: kaggle-playground-series-s6e9-autonomous
  cancel-in-progress: false

jobs:
  compete:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      # Submission is intentionally human-only.
      KAGGLE_ALLOW_AUTO_SUBMIT: "false"
      KAGGLE_APPROVED_COMPETITIONS: playground-series-s6e9

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install agent and boosted models
        run: python -m pip install -e ".[boost]"

      - name: Verify Kaggle access
        run: kaggle-agent doctor

      - name: Run autonomous EV experiment cycle
        run: kaggle-agent auto "playground-series-s6e9"

      - name: Persist EV learning state safely
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kaggle-topper-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/playground-series-s6e9.json
          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi
          git commit -m "chore: persist autonomous EV state [skip ci]"
          # Code/config may advance while a long experiment is running. Rebase
          # only non-state changes, then deliberately keep this run's freshly
          # computed state file so concurrent commits cannot create a conflict.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              if git status --porcelain | grep -q "state/playground-series-s6e9.json"; then
                git checkout --theirs state/playground-series-s6e9.json
                git add state/playground-series-s6e9.json
                GIT_EDITOR=true git rebase --continue || true
                if git push origin HEAD:main; then exit 0; fi
              fi
            fi
            echo "State push collision; retrying ($attempt/5)..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Unable to persist state after retries."
          exit 1

      - name: Upload candidate submissions and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-agent-playground-series-s6e9-${{ github.run_id }}
          path: |
            workspace/playground-series-s6e9/rule_report.json
            workspace/playground-series-s6e9/runs/**/submission.csv
            workspace/playground-series-s6e9/runs/**/ensemble.json
            reports/**
          if-no-files-found: ignore
          retention-days: 14
